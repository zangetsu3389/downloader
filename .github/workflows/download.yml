name: Download Page Assets

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'آدرس صفحه‌ای که می‌خواهید دانلود کنید'
        required: true
        type: string
      wait_time:
        description: 'زمان انتظار برای اسکرول (ثانیه)'
        required: false
        type: number
        default: 3

jobs:
  download-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        # استفاده از آخرین نسخه v4
        uses: actions/checkout@v4

      - name: Set up Python
        # استفاده از آخرین نسخه v5
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install selenium requests

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg2
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-chrome.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Install ChromeDriver
        run: |
          # دریافت نسخه کروم نصب شده
          CHROME_VERSION=$(google-chrome --version | grep -oP '[\d.]+')
          # دریافت آخرین درایور مطابقت
          CHROMEDRIVER_VERSION=$(curl -s "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_${CHROME_VERSION}")
          wget "https://chromedriver.storage.googleapis.com/${CHROMEDRIVER_VERSION}/chromedriver_linux64.zip"
          unzip chromedriver_linux64.zip
          sudo mv chromedriver /usr/local/bin/
          chromedriver --version

      - name: Run Downloader
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          WAIT_TIME: ${{ github.event.inputs.wait_time }}
        run: |
          if [ -z "$TARGET_URL" ]; then
            echo "لطفاً آدرس URL را وارد کنید."
            exit 1
          fi
          
          # جایگزینی URL در فایل پایتون
          sed -i "s|TARGET_URL = \".*\"|TARGET_URL = \"$TARGET_URL\"|" downloader.py
          sed -i "s|wait_time=2|wait_time=$WAIT_TIME|" downloader.py
          
          # اجرای پایتون و نمایش خطاها در صورت بروز مشکل
          python downloader.py || {
            echo "خطا در اجرای اسکریپت پایتون رخ داد."
            cat downloader.py # نمایش کد پایتون برای دیباگ
            exit 1
          }

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-page-assets
          path: ./downloaded_assets/
          compression-level: 9
